    <script>

        let datos;
        let limit = 10;
        const randomElements = [];
        let currentIndex = 0;
        var $wrapper = $('.wrapper');
        let pregInconrrectas = 0;
        let pregCorrectas = 0;

        $(document).ready(function () {
            let arrayPreguntas = [];
            let preguntasMostradas = [];
            $.extend({
                cargarUnidades: function () {
                    const xhttp = new XMLHttpRequest();
                    xhttp.open("GET", "contenidoJSON/unidades.json", true);
                    xhttp.send();

                    xhttp.onreadystatechange = function () {
                        if (this.readyState == 4 && this.status == 200) {
                            let datos = JSON.parse(xhttp.responseText);

                            let x = 1;
                            let ContUnidades = '';
                            for (let itemUnid of datos) {
                                ContUnidades += '<div data-id="' + itemUnid.id + '" data-nombre="' + itemUnid.nombre + '" onclick="$.mostrarTemas(this)" class="unidad">' + itemUnid.nombre + '</div>';
                                x++;
                            }
                            $("#LisUnidades").html(ContUnidades);
                        }
                    };
                },
                mostrarTemas: function (element) {
                    let unidad = element.getAttribute('data-id');
                    let nombre = element.getAttribute('data-nombre');



                    // document.getElementById("titu_Evaluacion").innerHTML = "Evaluación -" + nombre;
                    document.getElementById("divTituloTema").innerHTML = nombre;


                    var Titulo = document.getElementById("Titulo");
                    Titulo.style.top = "-150px";

                    var Listunidades = document.getElementById("LisUnidades");
                    Listunidades.style.left = "-2000px";

                    let divImgPrinc = document.getElementById("divImagenPrincipal");
                    setTimeout(() => {
                        divImgPrinc.style.bottom = "-700px";
                    }, 200)

                    setTimeout(() => {
                        var divTitulo = document.getElementById("divTituloTema");
                        divTitulo.style.top = "0px";

                    }, 500)
                    var ListTemas = document.getElementById("ListTemas");
                    ListTemas.style.display = "block";
                    setTimeout(() => {
                        ListTemas.style.left = "0px";
                    }, 800)



                    setTimeout(() => {
                        Listunidades.style.display = "none";
                    }, 1000)

                    $("#unidadActual").val(unidad);

                    const xhttp = new XMLHttpRequest();
                    xhttp.open("GET", "contenidoJSON/tematicas.json", true);
                    xhttp.send();

                    $("#unidades").hide();
                    $("#Temas").show();
                    $("#btn_AtrasUnid").show();

                    xhttp.onreadystatechange = function () {
                        if (this.readyState == 4 && this.status == 200) {
                            let datos = JSON.parse(xhttp.responseText);
                            let arrayTemas = datos.filter((e) => e.unidad == unidad);
                            let x = 1;
                            let ContTemas = "";
                            let display = 'block';
                            for (let itemTem of arrayTemas) {
                                if (itemTem.objetivo == null) {
                                    display = 'none';
                                }
                                ContTemas += '<div data-tema="' + itemTem.id + '" data-titulo="' + itemTem.titulo + '" onclick="$.mostrarDetTemas(this)" class="tema">' + itemTem.titulo + '<div class="pstyle" style="display: ' + display + '">' + itemTem.objetivo + '</div><p class="consGramatica"><i class="fa fa-exclamation-circle" aria-hidden="true"></i></p></div>'
                                x++;
                                display = 'block';
                            }



                            $("#ListTemas").html(ContTemas);
                        }
                    };



                    $.verfEval(unidad);
                },
                verfEval: function (unid) {
                    const xhttp = new XMLHttpRequest();
                    xhttp.open("GET", "contenidoJSON/preguntas.json", true);
                    xhttp.send();

                    xhttp.onreadystatechange = function () {
                        if (this.readyState == 4 && this.status == 200) {
                            let datos = JSON.parse(xhttp.responseText);
                            let preguntas = datos.filter((e) => e.unidad == unid);

                            tPreg = preguntas.length;

                            if (tPreg > 0) {
                                $("#btn_Eval").show();
                            } else {
                                $("#btn_Eval").hide();
                            }

                        }
                    };
                },
                mostrarDetTemas: function (element) {

                    $wrapper.find("> main").html("");

                    var divTitulo = document.getElementById("divTituloTema");
                    divTitulo.style.top = "-100px";

                    var ListTemas = document.getElementById("ListTemas");
                    ListTemas.style.left = "-2000px";

                    setTimeout(() => {
                        ListTemas.style.display = "none";
                    }, 2000)

                    let divImgPrinc = document.getElementById("divImagenPrincipal");
                    setTimeout(() => {
                        divImgPrinc.style.bottom = "-700px";
                    }, 200)

                    let divPrincipal = document.getElementById("gramaticaPrincipal");
                    setTimeout(() => {
                        divPrincipal.style.backgroundImage = "url(images/interfaz/gramatica/fondoGramaticaSegundaria.png)";
                    }, 1000)


                    let idcont = element.getAttribute("data-tema");
                    let titulo = element.getAttribute("data-titulo");

                    document.getElementById("tituloTema").innerHTML = titulo;

                    $wrapper.avnSkeleton();
                    let xhr = new XMLHttpRequest();
                    xhr.overrideMimeType("application/json");
                    xhr.open('GET', "contenidoJSON/detTematicas.json", true);
                    xhr.onreadystatechange = function () {
                        if (xhr.readyState === 4 && xhr.status === 200) {

                            let datos = JSON.parse(xhr.responseText);
                            let arrayTemas = datos.filter((e) => e.id == idcont);
                            let contenidoHTML = '';


                            arrayTemas.forEach(itemTem => {
                                contenidoHTML += itemTem.contenido;
                                // $.habilitarVideo(itemTem.id);
                            });

                            contenidoHTML = aumentarFontSizeEnHtml(contenidoHTML, 10);

                            $wrapper.avnSkeleton("remove");
                            $wrapper.find("> main").append(contenidoHTML);

                            // Evento de clic y táctil para abrir modal
                            $("#DetTema img").on("click touchstart", function () {
                                abrirModal(this.src);
                            });

                            $("#IdCont").val(idcont);

                            var detTemas = document.getElementById("DetTema");
                            var tituloTema = document.getElementById("tituloTema");
                            detTemas.style.display = "block";
                            tituloTema.style.display = "block";

                            setTimeout(() => {
                                detTemas.style.left = "0px";
                                tituloTema.style.left = "50px";
                            }, 3000)


                            $("#btn_AtrasUnid").hide();
                            $("#btn_AtrasTem").show();
                        }
                        else if (xhr.readyState === 4 && xhr.status !== 200) {
                            console.error('Error fetching data:', xhr.statusText);
                        }
                    };
                    xhr.send();

                    function abrirModal(imagenSrc) {
                        // Crear un modal...
                        var modal = document.createElement("div");
                        modal.classList.add("modal-container");

                        var imagenModal = document.createElement("img");
                        imagenModal.src = imagenSrc;

                        modal.appendChild(imagenModal);

                        var closeButton = document.createElement("button");
                        closeButton.innerHTML = "<i class='fa fa-close'></i>";
                        closeButton.classList.add("modal-close-buttonG");
                        modal.appendChild(closeButton);

                        document.body.appendChild(modal);

                        closeButton.addEventListener("click", function () {
                            document.body.removeChild(modal);
                        });

                        document.body.addEventListener("touchstart", function closeOnTouchOutside(event) {
                            if (!modal.contains(event.target) && event.target !== closeButton) {
                                document.body.removeChild(modal);
                                document.body.removeEventListener("touchstart", closeOnTouchOutside);
                            }
                        });
                    }
                },

            function aumentarFontSizeEnHtml(html, porcentaje) {
                const parser = new DOMParser();
                const doc = parser.parseFromString(html, 'text/html');
                const elementos = doc.body.querySelectorAll('*');

                elementos.forEach(elemento => {
                    const style = window.getComputedStyle(elemento);
                    const fontSize = parseFloat(style.fontSize);
                    const nuevoFontSize = fontSize * (1 + porcentaje / 100);
                    elemento.style.fontSize = nuevoFontSize + 'px';
                });

                return doc.body.innerHTML;
            }

            function mostPregunta() {

                }
            }

            function obtenerIndiceAleatorio() {
                let indice = Math.floor(Math.random() * arrayPreguntas.length);

                while (preguntasMostradas.includes(indice)) {
                    indice = Math.floor(Math.random() * arrayPreguntas.length);
                }
                preguntasMostradas.push(indice);
                return indice;
            }
